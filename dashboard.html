<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KOPIRATES Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <!-- HEADER -->

    <div class="topbar">

        <h1 id="logo" data-lang="dashboard">☕ Dashboard Kasir KOPIRATES</h1>

        <div class="lang-switch">

            <button class="lang-btn active" onclick="setLang('id',this)">ID</button>
            <button class="lang-btn" onclick="setLang('en',this)">EN</button>

        </div>

    </div>


    <!-- STATS -->

    <div class="grid">

        <div class="card">

            <h3 data-lang="total_order">Total Order</h3>

            <div class="big" id="totalOrder">0</div>

        </div>


        <div class="card">

            <h3 data-lang="income">Total Pendapatan</h3>

            <div class="big">

                Rp <span id="income">0</span>

            </div>

        </div>


        <div class="card best-seller-card">

            <h3 data-lang="best_today">🔥 Terlaris Hari Ini</h3>

            <div id="bestMenuList"></div>

        </div>


        <div class="card">

            <h3 data-lang="status">Status</h3>

            <div id="notif" data-lang="waiting">
                Menunggu order...
            </div>

        </div>

    </div>


    <!-- RESET BUTTON -->

    <div class="reset-wrapper">
        <button class="reset-btn" onclick="resetOrders()" data-lang="reset_today">
            🗑 Reset Hari Ini
        </button>
    </div>

    <div class="card">
        <h3>Kontrol Menu Habis 🔴</h3>

        <div id="menuControl"></div>

        <button onclick="saveOutOfStock()">
            💾 Simpan Perubahan
        </button>
    </div>



    <!-- CHART -->

    <h2 class="chart-title" data-lang="sales_chart">
        Grafik Penjualan
    </h2>

    <canvas id="salesChart"></canvas>


    <!-- ORDER LIST -->

    <div class="order-list">

        <h2 data-lang="incoming_order">Order Masuk</h2>

        <div id="orders"></div>

    </div>


    <!-- LIBRARIES -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


    <!-- SYSTEM -->

    <script src="js/firebase.js"></script>
    <script src="js/system.js"></script>
    <script src="js/dashboard.js"></script>


    <!-- LANGUAGE -->

    <script src="js/lang.js"></script>

    <!-- ===============================
SOUND NOTIFICATION ORDER
=============================== -->

    <audio id="notifSound" src="asets/notif.mp3"></audio>

</body>

</html>
